<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Word Fishing · The Coast: um jogo de pesca em inglês e português, com mais de 60 espécies, barcos, portos e um diário de peixes.">
<link rel="canonical" href="https://professorjoaoassis.github.io/laboratory/the-coast/">
<link rel="icon" href="../../favicon.ico" sizes="48x48">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<title>Word Fishing · The Coast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&family=Geist:wght@400;600&display=swap">
<style>
:root{--bg:#08090b;--panel:#0f1115;--ink:#e9e6dc;--soft:#a3a39d;--dim:#6b6c70;--line:#24272d;--magma:#ff6a2b;--spark:#f2d33b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.hud{position:fixed;top:12px;left:16px;display:flex;gap:10px;pointer-events:none;flex-wrap:wrap}
.chip{background:rgba(8,9,11,.78);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 14px Geist,system-ui,sans-serif;display:flex;gap:6px;align-items:center}
.chip b{color:var(--spark);font-weight:600}
.chip[hidden]{display:none}
.cine .hud,.cine .hint,.cine .pad .stick,.cine .pad .szone,.cine .pad .sm{display:none}
.hall .hint{display:none}
.row.proto{opacity:.75;border-top:1px dashed rgba(255,255,255,.15);padding-top:10px}
.hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font:400 13px "Geist Mono",monospace;color:var(--soft);pointer-events:none;padding:0 16px;text-shadow:0 1px 0 #000}
.hint kbd{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:rgba(8,9,11,.6)}
.panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,9,11,.55);padding:16px}
.panel[hidden]{display:none}
.card{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.card h2{margin:0;font-size:20px;letter-spacing:-.02em}
.card p{margin:0;color:var(--soft);font-size:14px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row small{color:var(--dim);font-size:13px;grid-column:1}
.row strong{font-weight:600}
button{font:600 14px Geist,system-ui,sans-serif;color:#1a0c04;background:var(--magma);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
button[disabled]{background:#2a2d33;color:var(--dim);cursor:default}
button.ghost{background:none;color:var(--soft);border:1px solid var(--line)}
.card.wide{width:min(780px,100%)}
.card h3{margin:8px 0 0;font-size:15px;color:var(--spark);font-weight:600}
.card p.how{margin-top:-10px;font-size:13px;color:var(--dim)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dex b{font-weight:600}
.dex em{display:block;font-style:normal;color:var(--soft);font-size:12px;margin-top:4px;line-height:1.35}
.dex div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.dex div span{display:block;color:var(--dim);font-size:12px}
.dex img{display:block;height:40px;max-width:100%;object-fit:contain;object-position:left center;margin:2px 0 6px;image-rendering:pixelated}
.dex .no{opacity:.35}
.pad{position:fixed;bottom:44px;left:0;right:0;display:none;justify-content:flex-end;align-items:flex-end;padding:0 16px;pointer-events:none}
.szone{position:fixed;left:0;top:70px;bottom:0;width:55%;pointer-events:auto;touch-action:none}
.stick{position:fixed;left:24px;bottom:40px;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(15,17,21,.25),rgba(15,17,21,.6));border:2px solid rgba(233,230,220,.18);pointer-events:none;transition:opacity .25s;opacity:.7}
.stick.on{opacity:1;transition:none}
.stick::before{content:"";position:absolute;inset:30%;border-radius:50%;border:1px dashed rgba(233,230,220,.12)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(245,240,228,.95),rgba(190,184,170,.9));box-shadow:0 3px 8px rgba(0,0,0,.5)}
.stick.run .knob{background:radial-gradient(circle at 40% 35%,#ffd36b,#e8892f)}
.pad button{pointer-events:auto;border-radius:12px;background:rgba(15,17,21,.75);border:1px solid var(--line);color:var(--ink);font-size:20px;padding:0;touch-action:none}
.pad .act{width:76px;height:76px;border-radius:50%;background:rgba(255,106,43,.85);color:#1a0c04}
.acts{display:flex;gap:10px;align-items:flex-end}
.pad .sm{width:54px;height:54px;border-radius:50%;font-size:14px}
.pad .sm.on{background:rgba(242,211,59,.85);color:#1a0c04}
.chip.alert{border-color:var(--spark);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{background:rgba(242,211,59,.25)}}
@media (pointer:coarse){.pad{display:flex}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Word Fishing, the coast. Walk with the arrow keys or WASD, hold Shift to run, press Space to fish or talk and F to throw a net."></canvas>
<div class="hud"><div class="chip">◉ <b id="coins">0</b></div><div class="chip" title="Basket space: small fish take less room">🐟 <span id="basket">0/10</span></div><div class="chip alert" id="bite" hidden>🎣 <b>bite!</b></div><div class="chip" id="zone" hidden><span></span></div><div class="chip" id="clock"></div></div>
<div class="hint"><kbd>WASD</kbd>/<kbd>arrows</kbd> walk · <kbd>shift</kbd> run · <kbd>space</kbd> fish, reel in (hold), board, talk, read · <kbd>F</kbd> throw the net · <kbd>J</kbd> fish journal</div>
<div class="pad"><div class="szone" aria-hidden="true"></div><div class="stick" aria-label="Move: drag the stick"><div class="knob"></div></div><div class="acts"><button class="sm" data-k="run">run</button><button class="sm" data-k="net">net</button><button class="act" data-k="act">fish</button></div></div>
<div class="panel" id="panel" hidden><div class="card" id="card"></div></div>
<script>
(() => {
'use strict';
/* ==========================================================================================
   WORD FISHING · THE COAST — a top-down prototype in the website's ASCII style.
   Every plant is a spring: the dwarf pushes it aside, it wobbles back. Animation is continuous
   (driven by time and distance walked), so it is as smooth as the screen's refresh rate.
   ========================================================================================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const hash = (x, y) => { let n = (x * 374761393 + y * 668265263) | 0; n = (n ^ (n >>> 13)) * 1274126177 | 0; return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
function vn(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), u), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v); }
const fbm = (x, y) => vn(x, y) * .55 + vn(x * 2.1, y * 2.1) * .3 + vn(x * 4.3, y * 4.3) * .15;
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function ramp(stops, n = 24) { const out = []; for (let s = 0; s < n; s++) { const p = s / (n - 1) * (stops.length - 1), i = Math.min(Math.floor(p), stops.length - 2), f = p - i, a = hex(stops[i]), b = hex(stops[i + 1]); out.push(`rgb(${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)})`); } return out; }
const pick = (r, t) => r[clamp(Math.round(t * (r.length - 1)), 0, r.length - 1)];
// the same colours as the beach on the website
const WATER = ramp(['#dfe6f2', '#8fb2f0', '#4f80dc', '#2c58b4', '#1b3a82']);
const SAND = ramp(['#8a7630', '#ad9640', '#cdb256', '#e2c978']);
const WET = ramp(['#8b8e96', '#7d7458', '#a8912f']);
const GREEN = ramp(['#2e5a2a', '#43803a', '#5fa548', '#9bd66a']);
const FOREST = ramp(['#1c3a24', '#2f5e36', '#417a44', '#62a052']);
const PATHC = ramp(['#6b5436', '#8a7048', '#a88a5a']);
const ROCKC = ramp(['#3b3e44', '#5c5f66', '#8a8e96']);
const WOOD = ['#5a3c22', '#7a5532', '#9a6c40', '#b88850'];
const HILITE = '#b9d0fa', SPARK = '#f2d33b', MAGMA = '#ff6a2b';

/* ==========================================================================================
   THE MAP — Stoneshard proportions: one cell is 10 x 16 world units, the dwarf stands about
   3 cells tall. The shack is ~4 dwarfs tall, town houses 5–6, the beach is a broad strip.
   Sea along the bottom, town at the top.
   ========================================================================================== */
const GW = 660, GH = 250;
const DEEP = 0, SHALLOW = 1, SAND_T = 2, GRASS = 3, BUSH = 4, FLOWER = 5, PATH = 6, DOCK = 7, DIRT = 8, DUNE = 9, WEED = 10;
const T = new Uint8Array(GW * GH), G = new Float32Array(GW * GH), SH = new Float32Array(GW), SOLID = new Uint8Array(GW * GH);
const OX = new Float32Array(GW * GH), OY = new Float32Array(GW * GH), VX = new Float32Array(GW * GH), VY = new Float32Array(GW * GH);
const TROD = new Float32Array(GW * GH), ACTIVE = new Set();
const id = (i, j) => j * GW + i;
const inb = (i, j) => i >= 0 && j >= 0 && i < GW && j < GH;
const AS = 3;                      // one art pixel = 3 world units (and 3 screen px on desktop)
const props = [];                  // big pixel-art things, sorted with the dwarf by their base line

/* ---------- pixel-art generator: buildings and props are painted once into small canvases ---------- */
function mk(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const p = (x, y, col, ww = 1, hh = 1) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), ww, hh); };
  fn(p, g, w, h);
  // a dark outline around the whole silhouette, the way pixel artists close their shapes
  const d = g.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (a[i + 3] > 0) continue;
    const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < w && yy < h && a[(yy * w + xx) * 4 + 3] > 200;
    if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) { o[i] = 20; o[i + 1] = 14; o[i + 2] = 10; o[i + 3] = 255; } }
  g.putImageData(new ImageData(o, w, h), 0, 0);
  return c;
}
const R = s => { let v = s; return () => (v = (v * 16807) % 2147483647) / 2147483647; };
const shade = (pal, t) => pal[clamp(Math.floor(t * pal.length), 0, pal.length - 1)];
const PLANK = ['#4a3220', '#5a3c22', '#6b4a2a', '#7a5532', '#8a6238'];
const SHINGLE = ['#2e241c', '#3e3226', '#4e4032', '#5e4e3e'];
const STONE = ['#5c5a55', '#77746c', '#8f8b80', '#a8a398'];
const PLASTER = ['#9a8f78', '#b3a78c', '#c9bd9f'];
const MOSS = ['#3c5a2c', '#4f7236', '#62873e'];
const CANVAS_C = ['#8a7a5a', '#a8946a', '#c2ad80', '#d6c294'];

// the rundown shack: a sagging roof with a hole, weathered planks, a missing board, a drying net
const SHACK = mk(66, 60, (p, g, w) => {
  const r = R(11);
  for (let y = 33; y < 57; y++) for (let x = 4; x < 62; x++) {          // front wall
    const pl = (x - 4) >> 2, seam = (x - 4) % 4 === 0, tone = hash(pl, 3) * .7 + (y < 37 ? .25 : 0) - (y > 52 ? .15 : 0);
    p(x, y, seam ? '#2e2016' : shade(PLANK, tone + hash(x, y) * .12));
  }
  for (let y = 38; y < 47; y++) { p(12, y, '#140e0a', 3, 1); }            // a missing board
  for (let y = 41; y < 57; y++) for (let x = 25; x < 35; x++) p(x, y, (x === 25 || x === 34 || y === 41) ? '#2e2016' : ((x - 25) % 3 === 0 ? '#20160e' : '#2c1e12'));  // door
  p(32, 49, '#c9c2ae', 1, 2);
  for (let y = 40; y < 47; y++) for (let x = 45; x < 54; x++) p(x, y, (x === 45 || x === 53 || y === 40 || y === 46) ? '#2e2016' : (x === 49 || y === 43) ? '#5a3c22' : '#e9b85a');   // a lit window
  for (let y = 36; y < 54; y++) for (let x = 5; x < 22; x++) if (((x + y) % 4 === 0 || (x - y + 40) % 4 === 0) && y < 36 + (x - 5) * 1.3) p(x, y, '#bdb6a2');   // a net hung to dry
  for (let x = 6; x < 21; x++) p(x, 36, '#7a5532');
  // roof: seen from above, sagging in the middle, rows of shingles, moss, a hole showing the rafters
  for (let y = 4; y < 34; y++) {
    const sag = Math.sin((y - 4) / 30 * Math.PI) * 1.5;
    for (let x = 1; x < 65; x++) {
      const row = (y - 4) / 3 | 0, off = row % 2 ? 2 : 0, edge = (x + off) % 5 === 0, depth = (y - 4) / 30;
      let c = shade(SHINGLE, .25 + depth * .55 + hash((x + off) / 5 | 0, row) * .3 - (edge ? .3 : 0) + (y % 3 === 0 ? -.15 : 0));
      if (fbm(x * .15, y * .2) > .62) c = shade(MOSS, hash(x, y));
      if (y > 6 + sag && y < 33) p(x, y, c);
    }
  }
  for (let y = 12; y < 20; y++) for (let x = 40; x < 50; x++) if ((x - 45) ** 2 / 25 + (y - 16) ** 2 / 16 < 1) p(x, y, (x % 3 === 0) ? '#5a3c22' : '#120c08');  // the hole
  for (let x = 1; x < 65; x++) { p(x, 33, '#22180f'); p(x, 34, '#3e2a1a'); }   // eave
  for (let x = 0; x < 66; x++) p(x, 6 + Math.round(Math.sin(x / 66 * Math.PI) * 1.5), '#5e4e3e');   // ridge
  p(52, 0, '#4e4032', 4, 7); p(51, 0, '#2e241c', 6, 1);                      // a crooked chimney
});
// a stone-and-timber town house, like Stoneshard's
function house(seed, wide, sty) {
  const W_ = wide ? 92 : 76, HS = sty || {}, WALL = HS.wall || PLASTER, ROOF = HS.roof || SHINGLE;
  return mk(W_, 84, (p) => {
    const r = R(seed);
    for (let y = 42; y < 81; y++) for (let x = 3; x < W_ - 3; x++) {
      let c;
      if (y >= 64) { const by = (y - 64) / 5 | 0, bx = ((x + (by % 2) * 4) / 8) | 0, mortar = (y - 64) % 5 === 0 || (x + (by % 2) * 4) % 8 === 0; c = mortar ? '#3e3c38' : shade(STONE, hash(bx, by + seed) * .8 + .1); }
      else { const beam = (x - 3) % 18 < 2 || y === 42 || y === 43 || y === 62 || y === 63 || (Math.abs(((x - 3) % 18) - 9) === Math.round((y - 44) / 2.2) && y < 62); c = beam ? '#3a2616' : shade(WALL, hash(x >> 2, y >> 2) * .6 + .3); }
      p(x, y, c);
    }
    const dx = W_ / 2 - 6 | 0;
    for (let y = 60; y < 81; y++) for (let x = dx; x < dx + 13; x++) { const arch = y < 64 && ((x - dx - 6) ** 2 / 42 + (y - 64) ** 2 / 16 > 1); if (!arch) p(x, y, (x === dx || x === dx + 12 || (x - dx) % 4 === 1) ? '#2e2016' : '#4a3220'); }
    [[12, 48], [W_ - 24, 48]].forEach(([wx, wy]) => { for (let y = wy; y < wy + 9; y++) for (let x = wx; x < wx + 9; x++) p(x, y, (x === wx || x === wx + 8 || y === wy || y === wy + 8) ? '#3a2616' : (x === wx + 4 || y === wy + 4) ? '#3a2616' : (seed % 2 ? '#e9b85a' : '#2a3040')); });
    for (let i = 0; i < 70; i++) { const x = 4 + r() * 22, y = 44 + r() * 34; if (!HS.noIvy && fbm(x * .2, y * .2) > .45) p(x, y, shade(MOSS, r())); }   // ivy
    for (let y = 2; y < 44; y++) { const inset = Math.max(0, 6 - y) ; for (let x = inset; x < W_ - inset; x++) { const row = (y - 2) / 3 | 0, off = row % 2 ? 3 : 0, e = (x + off) % 6 === 0; let c = shade(ROOF, .2 + (y / 44) * .6 + hash((x + off) / 6 | 0, row + seed) * .25 - (e ? .25 : 0)); if (!HS.noIvy && fbm(x * .1 + seed, y * .15) > .66) c = shade(MOSS, hash(x, y) * .7); if (HS.snow && (y < 9 + Math.sin(x * .4) * 2 || (y > 39 && hash(x, y) < .5))) c = shade(['#c4cdd8', '#e4e9f0', '#ffffff'], hash(x >> 1, y)); p(x, y, c); } }
    for (let x = 0; x < W_; x++) { p(x, 43, '#1c140c'); p(x, 44, '#2e2016'); }
    p(W_ - 20, 0, '#5c5a55', 6, 10);
  });
}
const TENT = mk(54, 46, (p) => {
  for (let y = 26; y < 44; y++) for (let x = 6; x < 48; x++) p(x, y, '#120c08');           // the dark inside
  for (let x = 6; x < 48; x++) for (let y = 34; y < 40; y++) p(x, y, y === 34 ? '#8a6238' : '#5a3c22');   // the counter
  [[10, 31, '#a9c2d9'], [15, 32, '#8fb2f0'], [20, 31, '#4fa3a0'], [27, 32, '#ff8a6b'], [33, 31, '#a9c2d9'], [39, 32, '#9aa3ad']].forEach(([x, y, c]) => { p(x, y, c, 4, 2); p(x + 4, y, c); p(x - 1, y + 1, c); p(x + 3, y, '#14161a'); });
  for (let y = 2; y < 28; y++) { const half = 22 + (y - 2) * .45; for (let x = 27 - half; x < 27 + half; x++) { const stripe = ((x - 27 + 100) / 6 | 0) % 2; p(x, y, stripe ? shade(['#8c2a20', '#a8342a', '#c0392b'], .3 + (y / 28) * .6) : shade(CANVAS_C, .3 + (y / 28) * .6)); } }
  for (let x = 4; x < 51; x++) if (x % 5 < 3) p(x, 27 + (x % 5 === 1 ? 1 : 0), '#c0392b');   // scalloped edge
  p(5, 26, '#3a2616', 2, 20); p(47, 26, '#3a2616', 2, 20);
});
const BOULDER = (seed, w, h) => mk(w, h, (p) => {
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (x - w / 2) / (w / 2), dy = (y - h * .55) / (h * .5), q = dx * dx + dy * dy + (fbm(x * .15 + seed, y * .2) - .5) * .5;
    if (q > 1) continue;
    const light = clamp(.75 - dy * .5 - dx * .2 + (fbm(x * .3, y * .3 + seed) - .5) * .4, 0, 1);
    p(x, y, fbm(x * .18 + seed, y * .25) > .63 && dy < 0 ? shade(MOSS, light) : shade(['#3b3e44', '#4e5158', '#686b72', '#8a8e96', '#a6aab0'], light));
  }
});
const BOAT = mk(52, 22, (p) => {
  for (let y = 3; y < 20; y++) for (let x = 2; x < 50; x++) { const dx = (x - 26) / 24, dy = (y - 11) / 8.5; if (dx * dx + dy * dy * 1.3 > 1) continue; const inner = dx * dx + dy * dy * 2.2 < .7; p(x, y, inner ? (x % 6 === 0 ? '#3a2616' : '#4a3220') : shade(PLANK, .35 + (y < 11 ? .4 : 0) + hash(x >> 2, y) * .2)); }
  for (let y = 9; y < 14; y++) for (let x = 30; x < 37; x++) if ((x - 33) ** 2 / 9 + (y - 11) ** 2 / 4 < 1) p(x, y, '#08090b');   // the hole in the hull
  for (let x = 14; x < 40; x += 9) p(x, 6, '#7a5532', 2, 11);
  p(8, 15, '#8a6238', 30, 2);                                                               // a broken oar
});
const BARREL = mk(12, 14, (p) => { for (let y = 0; y < 14; y++) for (let x = 0; x < 12; x++) { const dx = (x - 5.5) / 6; if (dx * dx > 1) continue; p(x, y, (y === 3 || y === 10) ? '#3e3c38' : y < 2 ? '#2e2016' : shade(PLANK, .5 + (1 - Math.abs(dx)) * .5)); } });
const CRATE = mk(14, 12, (p) => { for (let y = 0; y < 12; y++) for (let x = 0; x < 14; x++) p(x, y, (x === 0 || x === 13 || y === 0 || y === 11 || x === y + 1 || y < 3) ? '#5a3c22' : '#8a6238'); });
const DRIFT = s => mk(26, 8, (p) => { const r = R(s); for (let x = 1; x < 24; x++) { const y = 3 + Math.round(Math.sin(x * .3 + s) * 1.2); p(x, y, '#8a7a5a', 1, 2); p(x, y + 1, '#5a4a3a'); } p(6, 1, '#8a7a5a', 1, 2); p(18, 6, '#8a7a5a', 1, 2); });

function addProp(img, cx, baseY, opts = {}) {
  const sc = opts.sc || AS, w = img.width * sc, h = img.height * sc;
  const pr = Object.assign({ img, x: cx - w / 2, y: baseY - h, w, h, base: baseY, cx }, opts);

// a spot over the side to cast into, and a rod holder on the gunwale on that side
function boatSide(B, dist) {

function updBoat(B, dt, t, mx, my, running, auto) {

}

/* ---------------------------- critters ---------------------------- */
function updCritters(dt, t) {
  const pf = Math.hypot(P.vx, P.vy) > 100;
  for (const c of critters) {
    c.t += dt;
    const dp = Math.hypot(c.x - P.x, (c.y - P.y) * 1.2), scared = !P.boat && dp < (pf ? 100 : 56);
    if (c.k === 'gull') {
      if (c.st === 'walk') {
        if (scared) { c.st = 'fly'; c.z = 1; const a = Math.atan2(c.y - P.y, c.x - P.x) + (Math.random() - .5); c.vx = Math.cos(a) * 80; c.vy = Math.sin(a) * 50; c.land = c.sand(); c.t = 0; if (dp < 200) sfx.gull(); continue; }
        if (!(c.next > c.t - 5)) c.next = c.t + Math.random() * 2;
        if (c.t > c.next) { c.next = c.t + 1 + Math.random() * 3; const r = Math.random(); c.mode = r < .4 ? 'peck' : r < .75 ? 'step' : 'look'; if (c.mode === 'step') { c.vx = (Math.random() - .5) * 26; c.vy = (Math.random() - .5) * 12; c.f = c.vx < 0 ? -1 : 1; } else c.vx = c.vy = 0; }
        const nx = c.x + c.vx * dt, ny = c.y + c.vy * dt; if (!solidAt0(nx, ny)) { c.x = nx; c.y = ny; } else c.vx = c.vy = 0;
      } else if (c.st === 'fly') {
        const [lx, ly] = c.land, dx = lx - c.x, dy = ly - c.y, d = Math.hypot(dx, dy) || 1;
        c.vx = lerp(c.vx, dx / d * 85, Math.min(1, dt * 1.1)); c.vy = lerp(c.vy, dy / d * 60, Math.min(1, dt * 1.1));
        c.x += c.vx * dt; c.y += c.vy * dt; c.f = c.vx < 0 ? -1 : 1;
        c.z = lerp(c.z, d > 70 ? 60 : 0, Math.min(1, dt * (d > 70 ? 1.4 : 2.4)));
        if (d < 10 && c.z < 4) { c.st = 'walk'; c.z = 0; c.vx = c.vy = 0; c.next = c.t + 1; }
        if (c.t > 16) { c.land = c.sand(); c.t = 0; }
      } else { c.ang += dt * .3; c.x = c.cx + Math.cos(c.ang) * c.rr; c.y = c.cy + Math.sin(c.ang) * c.rr * .5; c.f = -Math.sin(c.ang) < 0 ? -1 : 1; c.z = 80 + Math.sin(t * .7 + c.rr) * 10; }
    } else if (c.k === 'crab') {
      if (c.st === 'walk') {
        if (scared) { c.st = 'run'; continue; }
        if (!(c.next > 0) || c.t > c.next) { c.next = c.t + .4 + Math.random() * 1.6; c.vx = Math.random() < .45 ? 0 : (Math.random() < .5 ? -1 : 1) * (18 + Math.random() * 22); if (Math.abs(c.x - c.hx) > 44) c.vx = -Math.sign(c.x - c.hx) * 26; }
        if (!solidAt0(c.x + c.vx * dt, c.y)) c.x += c.vx * dt;
      } else if (c.st === 'run') {
        const dx = c.hx - c.x, dy = c.hy - c.y, d = Math.hypot(dx, dy); c.vx = dx / (d || 1) * 70;
        if (d < 3) { c.st = 'hide'; c.hide = 3 + Math.random() * 5; } else { c.x += dx / d * 70 * dt; c.y += dy / d * 70 * dt; }
      } else { c.hide -= dt; if (c.hide <= 0 && dp > 80) { c.st = 'walk'; c.next = 0; } }
    } else if (c.k === 'turtle') {
      c.a += (Math.random() - .5) * dt * 1.5; const nx = c.x + Math.cos(c.a) * 10 * dt, ny = c.y + Math.sin(c.a) * 6 * dt, i = Math.floor(nx / 10), j = Math.floor(ny / 16);
      if (inb(i, j) && isWater(T[id(i, j)]) && j < SH[i] + 12 && j > SH[i] + 1) { c.x = nx; c.y = ny; } else c.a += Math.PI * .8;
    } else if (c.k === 'piper') {

      if (c.flee > 0) { c.flee -= dt; const nx = c.x + c.fd * 95 * dt; if (!solidAt0(nx, c.y - 20)) c.x = nx; c.f = c.fd; c.vx = 95; }
      else { const dy = ty - c.y; c.vx = Math.abs(dy) > 2 ? 80 : 0; c.y += clamp(dy, -80 * dt, 80 * dt); c.x += Math.sin(t * .4 + c.i0) * 6 * dt; }

  if (Math.random() < dt * .35) { const x = camX / kx + Math.random() * W / kx, y = camY / ky + Math.random() * H / ky, i = Math.floor(x / 10), j = Math.floor(y / 16); if (inb(i, j) && isWater(T[id(i, j)]) && j > SH[i] + 5) { const pool = ['sardine', 'mackerel', 'mullet', 'anchovy', 'bluefish']; jumpers.push({ x, y, t: 0, dur: .55 + Math.random() * .3, f: BY[pool[(Math.random() * pool.length) | 0]], s: Math.random() < .5 ? -1 : 1 }); splash(x, y, 4); } }

/* ==========================================================================================
   TIME AND WEATHER — a day lasts eight minutes. Nights are dark: lamps, windows and the dwarf's

const DAYLEN = 480;
const CLK = { day: st.day || 1, tod: st.tod != null ? st.tod : .06 };

const isDusk = () => { const h = hourNow(); return (h >= 5 && h < 7) || (h >= 18 && h < 20); };

const MOONS = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'], WXI = { clear: '☀️', cloudy: '☁️', rain: '🌧️', storm: '⛈️' };

  megalodon: { zone: 'deep', test: () => isNight() && moonPhase() === 4 && (WX.k === 'storm' || WX.k === 'rain'), hint: 'the deep · full-moon night · rain or storm' },
  Helicoprion: { zone: 'deep', test: () => isNight() && WX.k === 'rain', hint: 'the deep · a rainy night' },
  Stethacanthus: { zone: 'deep', test: () => isDusk(), hint: 'the deep · sunrise or sunset' },
  Xiphactinus: { zone: 'sea', test: () => !isNight() && WX.k === 'storm', hint: 'the open sea · a storm by day' },
  Enchodus: { zone: 'deep', test: () => isNight() && moonPhase() === 0, hint: 'the deep · a night with no moon' },
  Leedsichthys: { zone: 'sea', test: () => isNight() && moonPhase() === 4 && WX.k === 'clear', hint: 'the open sea · a calm full-moon night' }

// catching, region by region: the ports have their own shore, jetty and bay; the open sea is shared
function rollCatch(spot, gear, rg) {

  FISH.forEach(f => {

    if (f.home === 'relic') { const R_ = RELIC[f.en]; w = gear === 'rod' && R_ && R_.zone === spot && R_.test() ? 1.6 : 0; }

/* ---------------------------- rumours: who tells what ---------------------------- */
const RUMOURS = {

  megalodon: { who: 'brann', text: 'When the moon is round and the rain comes down, the biggest teeth in the sea come up to bite. Only at night, mind you, and only in the deep.' },
  lore2: { who: 'brann', text: 'Far south of the pier, in the deep, the water turns in a slow circle. Old maps mark that trench with a mask. A dwarf’s mask.' },
  Helicoprion: { who: 'sigrid', text: 'In Frostvik we say: the buzz-saw fish hunts in the deep on rainy nights. Its teeth go round and round, like a wheel.' },
  Stethacanthus: { who: 'sigrid', text: 'The shark with an anvil on its back rises from the deep only when the sun touches the sea, morning or evening.' },
  Xiphactinus: { who: 'tano', text: 'In a storm, in the daytime, a giant with a bulldog jaw chases the tuna across the open sea. My grandfather saw it once.' },
  Leedsichthys: { who: 'tano', text: 'On a calm night under a full moon, a fish as long as three boats drifts through the open sea. It only eats tiny things. Don’t be scared of it.' },
  Enchodus: { who: 'yara', text: 'On nights with no moon at all, the saber-toothed herring comes up from the deep. Two long teeth, like needles.' },
