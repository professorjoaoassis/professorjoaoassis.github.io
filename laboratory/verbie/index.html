<!doctype html><html lang="en"><head><meta name="description" content="Verbie: type an action and watch it acted out. Every verb form, with pronunciation."><link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Verbie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen toy theatre — search bar on top, the stage in the middle, the word card beside it, the verb shelf below */
:root{
  --bg:#e7f0f3; --panel:#ffffff; --ink:#17323d; --muted:#557079; --line:#d2e0e4; --chip:#f0f6f8;
  --accent:#ff6a33; --accent-ink:#ffffff; --accent-soft:#ffe3d6; --blue:#2f6fde;
  --sky-top:#9fd6f0; --sky-bottom:#e3f4fa; --grass:#8cc965; --grass-dark:#6aa846;
  --wall:#fbe8c8; --wall-line:#f0d4a6; --floor:#d9a46a; --floor-dark:#c08a4f;
  --water:#3e9fd3; --stage-ink:#17323d; --cloud:#ffffff;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1d24; --panel:#162a33; --ink:#e6f1f4; --muted:#93adb5; --line:#26414c; --chip:#1c343f;
  --accent:#ff7a45; --accent-ink:#1a0d06; --accent-soft:#4a2a1d; --blue:#7aa8ff;
  --sky-top:#13284a; --sky-bottom:#2d4f73; --grass:#3d6f3a; --grass-dark:#2e5a2c;
  --wall:#3a3348; --wall-line:#4a4159; --floor:#6b4a32; --floor-dark:#553a27;
  --water:#1f6a95; --stage-ink:#eef6f8; --cloud:#5f7c9b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1d24; --panel:#162a33; --ink:#e6f1f4; --muted:#93adb5; --line:#26414c; --chip:#1c343f;
  --accent:#ff7a45; --accent-ink:#1a0d06; --accent-soft:#4a2a1d; --blue:#7aa8ff;
  --sky-top:#13284a; --sky-bottom:#2d4f73; --grass:#3d6f3a; --grass-dark:#2e5a2c;
  --wall:#3a3348; --wall-line:#4a4159; --floor:#6b4a32; --floor-dark:#553a27;
  --water:#1f6a95; --stage-ink:#eef6f8; --cloud:#5f7c9b; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 40px}
.back{align-self:flex-start;font:600 13px var(--body);color:var(--muted);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:6px 14px;margin-bottom:-6px}
.back:hover{color:var(--ink);border-color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}

.searchrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.search{position:relative;flex:1 1 320px;min-width:0}
.search input{width:100%;font:600 20px/1 var(--body);color:var(--ink);background:var(--panel);
  border:3px solid var(--ink);border-radius:999px;padding:14px 20px 14px 52px;outline:none;
  box-shadow:0 4px 0 var(--ink)}
.search input:focus{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.sugg{position:absolute;left:12px;right:12px;top:calc(100% + 8px);background:var(--panel);border:2px solid var(--line);
  border-radius:16px;list-style:none;margin:0;padding:6px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.sugg li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer}
.sugg li b{font-family:var(--display);font-size:19px;font-weight:700}
.sugg li small{color:var(--muted)}
.sugg li.on,.sugg li:hover{background:var(--chip)}

.btn{font:600 15px/1 var(--body);color:var(--ink);background:var(--panel);border:3px solid var(--ink);border-radius:999px;
  padding:0 18px;min-height:52px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.chip:focus-visible,.say:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}

.stage{background:var(--panel);border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 6px 0 var(--ink);position:relative}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;max-width:100%}
.stage .ctl{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.stage .ctl .btn{min-height:40px;padding:0 13px;font-size:13px;box-shadow:0 3px 0 var(--ink);border-width:2px}

.card{background:var(--panel);border:3px solid var(--ink);border-radius:26px;padding:22px 22px 20px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:14px;min-width:0}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.word{font-family:var(--display);font-weight:800;font-size:clamp(46px,7vw,64px);line-height:.95;margin:0;text-wrap:balance;letter-spacing:-.01em}
.phrase{color:var(--muted);font-size:14px;margin-top:4px}
.pt{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;width:max-content;max-width:100%}
.pt::before{content:"PT";font-size:10px;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.say{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.say svg{width:22px;height:22px}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form{background:var(--chip);border-radius:14px;padding:8px 12px;min-width:0}
.form small{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.form b{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.example{border-top:2px dashed var(--line);padding-top:12px;display:flex;gap:10px;align-items:flex-start}
.example p{margin:0;font-size:17px;font-weight:500;flex:1;min-width:0}
.example p mark{background:none;color:var(--accent);font-weight:700}
.example .say{width:38px;height:38px;border-width:2px;background:var(--panel);color:var(--ink)}
.example .say svg{width:18px;height:18px}
.miss{background:var(--accent-soft);border-radius:16px;padding:10px 14px;font-size:14px}
.miss button{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;padding:0 2px;cursor:pointer;text-decoration:underline}

.shelf{display:flex;flex-direction:column;gap:14px}
.shelf h2{font-family:var(--display);font-size:22px;margin:0;font-weight:800}
.shelf .count{color:var(--muted);font-weight:500;font-family:var(--body);font-size:14px;margin-left:6px}
.group{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.group h3{flex:0 0 92px;margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:0}
.chip{font:600 15px/1 var(--body);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-current="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
@media (max-width:520px){.group h3{flex-basis:100%}.brand h1{font-size:26px}}
@media (prefers-reduced-motion: reduce){.btn:active,.say:active{transform:none}}
</style>

<div class="wrap">
  <a class="back" href="../">← Laboratory</a>
  <header>
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="var(--accent)" stroke="var(--ink)" stroke-width="3"/><circle cx="24" cy="13" r="5" fill="#f3c29b" stroke="#17323d" stroke-width="2"/><path d="M23 18 L20 28 M20 28 L14 35 M20 28 L27 34 M22 21 L29 17 M22 21 L15 24" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
      <div><h1>Verb<span>ie</span></h1><p>Type an action. Verbie does it!</p></div>
    </div>
  </header>

  <div class="searchrow">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="run, eat, dance, pular…" aria-label="Search a verb" aria-autocomplete="list" aria-controls="sugg">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
    </div>
    <button class="btn primary" id="rand" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>Surprise me</button>
  </div>

  <div class="main">
    <div class="stage">
      <canvas id="cv" width="800" height="600" aria-label="Verbie acting out the verb"></canvas>
      <div class="ctl">
        <button class="btn" id="slow" type="button" aria-pressed="false">Slow</button>
        <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
      </div>
    </div>
    <div class="card" id="card" aria-live="polite"></div>
  </div>

  <section class="shelf">
    <h2>All verbs<span class="count" id="count"></span></h2>
    <div id="groups" class="shelf"></div>
  </section>
</div>

<script>
/* ============ math ============ */
const S=Math.sin,C=Math.cos,PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=clamp(k,0,1);return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2};
const rotv=(x,y,a)=>{const c=C(a),s=S(a);return [x*c-y*s,x*s+y*c]};
const dir=a=>[S(a),C(a)];
const lp=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];

/* ============ stage ============ */
const LW=400,LH=300,G=262,CX=190;
const T=46,UA=25,FA=23,TH=31,SH=31,HR=17;
const COL={ink:'#1c2a38',skin:'#f3c29b',skinD:'#d9a47c',hair:'#3a2618',shirt:'#ff7a3d',shirtD:'#d9581f',pants:'#2f5fb3',pantsD:'#23488c',shoe:'#1c2a38',cheek:'#ff8a8a'};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let TH_={};
function readTheme(){const cs=getComputedStyle(document.documentElement);
  ['sky-top','sky-bottom','grass','grass-dark','wall','wall-line','floor','floor-dark','water','stage-ink','cloud','accent'].forEach(k=>TH_[k]=cs.getPropertyValue('--'+k).trim());
  TH_.dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light' || document.documentElement.dataset.theme==='dark';}
readTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme)}catch(e){}
new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});
function fit(){const r=cv.getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2.5);const w=Math.max(320,Math.round(r.width*d));cv.width=w;cv.height=Math.round(w*.75);}
window.addEventListener('resize',fit);

/* ============ pose & kinematics ============ */
function pose(o){return Object.assign({x:CX,y:0,lean:0,rot:0,head:0,aF:[0.12,0.3],aB:[-0.12,0.25],lF:[0.06,0],lB:[-0.06,0],eyes:'open',mouth:'smile',scroll:0,flip:1,scene:'out',alpha:1},o)}
function mix(A,B,k){const R={...A};for(const key in B){const a=A[key],b=B[key];
  if(typeof a==='number'&&typeof b==='number')R[key]=lerp(a,b,k);
  else if(Array.isArray(a)&&Array.isArray(b))R[key]=a.map((v,i)=>typeof v==='number'&&typeof b[i]==='number'?lerp(v,b[i],k):(k<.5?v:b[i]));
  else R[key]=k<.5&&key in A?a:b;}return R;}
function wk(f,amp,knee,arm,ae){return{lF:[amp*S(f),-0.1-knee*Math.max(0,C(f))],lB:[amp*S(f+PI),-0.1-knee*Math.max(0,C(f+PI))],aF:[arm*S(f+PI),ae],aB:[arm*S(f),ae]}}
function ik(ax,ay,tx,ty,L1,L2,sg){const dx=tx-ax,dy=ty-ay;let d=Math.hypot(dx,dy);d=clamp(d,Math.abs(L1-L2)+.5,L1+L2-.3);
  const b=Math.atan2(dy,dx),k=clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1),a=b+sg*Math.acos(k);
  return [[ax+C(a)*L1,ay+S(a)*L1],[ax+C(b)*d,ay+S(b)*d]];}

function solve(P){
  const r=P.rot,L=P.lean,hx=P.x;let hy=G-66+P.y;
  const rootF=[3,1],rootB=[-4,1];
  const fk=(a,root)=>{const d1=dir(a[0]);const k=[root[0]+d1[0]*TH,root[1]+d1[1]*TH];const d2=dir(a[0]+a[1]);return [k,[k[0]+d2[0]*SH,k[1]+d2[1]*SH]]};
  let lf=P.fFw?null:fk(P.lF,rootF), lb=P.fBw?null:fk(P.lB,rootB);
  if(P.plant){const low=Math.max(lf?lf[1][1]:-99,lb?lb[1][1]:-99);hy=G-4-low+P.y;}
  const toW=p=>{const v=rotv(p[0],p[1],r);return [hx+v[0],hy+v[1]]};
  const toL=w=>rotv(w[0]-hx,w[1]-hy,-r);
  if(P.fFw){const t=toL(P.fFw);lf=ik(rootF[0],rootF[1],t[0],t[1],TH,SH,-1)}
  if(P.fBw){const t=toL(P.fBw);lb=ik(rootB[0],rootB[1],t[0],t[1],TH,SH,-1)}
  const neck=[S(L)*T,-C(L)*T],sh=[S(L)*(T-6),-C(L)*(T-6)];
  const hl=L+P.head,hc=[neck[0]+S(hl)*(HR+2),neck[1]-C(hl)*(HR+2)];
  const arm=(f,hk,hw)=>{
    if(hw||hk){let tg,sg;if(hw){tg=toL(hw);sg=hw[2]??1}else{const v=rotv(hk[0],hk[1],L);tg=[sh[0]+v[0],sh[1]+v[1]];sg=hk[2]??1}
      return ik(sh[0],sh[1],tg[0],tg[1],UA,FA,sg)}
    const d1=dir(L+f[0]),e=[sh[0]+d1[0]*UA,sh[1]+d1[1]*UA],d2=dir(L+f[0]+f[1]);return [e,[e[0]+d2[0]*FA,e[1]+d2[1]*FA]]};
  const af=arm(P.aF,P.hF,P.hFw),ab=arm(P.aB,P.hB,P.hBw);
  return {hip:toW([0,0]),neck:toW(neck),sh:toW(sh),hc:toW(hc),ha:r+hl,ta:r+L,hy,
    rootF:toW(rootF),kF:toW(lf[0]),ftF:toW(lf[1]),rootB:toW(rootB),kB:toW(lb[0]),ftB:toW(lb[1]),
    elF:toW(af[0]),hF:toW(af[1]),elB:toW(ab[0]),hB:toW(ab[1])};
}
const headPt=(J,x,y)=>{const v=rotv(x,y,J.ha);return [J.hc[0]+v[0],J.hc[1]+v[1]]};

/* ============ drawing primitives ============ */
function path(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1])}
function stroke(c,pts,w,col){c.lineCap='round';c.lineJoin='round';path(c,pts);c.lineWidth=w;c.strokeStyle=col;c.stroke()}
function circ(c,x,y,r,fill,line=2.2){c.beginPath();c.arc(x,y,r,0,TAU);if(fill){c.fillStyle=fill;c.fill()}if(line){c.lineWidth=line;c.strokeStyle=COL.ink;c.stroke()}}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)}
function box(c,x,y,w,h,fill,r=3,line=2.4){rr(c,x,y,w,h,r);c.fillStyle=fill;c.fill();c.lineWidth=line;c.strokeStyle=COL.ink;c.stroke()}
function pop(c,txt,x,y,size,col,rot=0,alpha=1){c.save();c.globalAlpha*=alpha;c.translate(x,y);c.rotate(rot);c.font=`800 ${size}px "Baloo 2", "Trebuchet MS", sans-serif`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=size/4;c.strokeStyle='#fff';c.strokeText(txt,0,0);c.fillStyle=col||COL.ink;c.fillText(txt,0,0);c.restore()}
function bubble(c,txt,x,y,tx,ty,size=15){c.save();c.font=`700 ${size}px "Baloo 2", "Trebuchet MS", sans-serif`;const w=c.measureText(txt).width+20,h=size+14;
  const bx=clamp(x-w/2,4,LW-w-4),by=y-h/2;c.beginPath();c.moveTo(clamp(tx+10,bx+12,bx+w-12),by+h-1);c.lineTo(tx,ty);c.lineTo(clamp(tx+22,bx+18,bx+w-6),by+h-1);c.fillStyle='#fff';c.fill();c.lineWidth=2.2;c.strokeStyle=COL.ink;c.stroke();
  rr(c,bx,by,w,h,h/2);c.fill();c.stroke();c.beginPath();c.moveTo(clamp(tx+11,bx+12,bx+w-12),by+h-2.5);c.lineTo(clamp(tx+21,bx+18,bx+w-6),by+h-2.5);c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
  c.fillStyle=COL.ink;c.textAlign='center';c.textBaseline='middle';c.fillText(txt,bx+w/2,by+h/2+1);c.restore()}
function note(c,x,y,a,s=1){c.save();c.globalAlpha*=a;c.translate(x,y);c.scale(s,s);c.fillStyle=COL.ink;c.beginPath();c.ellipse(0,0,4.5,3.4,-.4,0,TAU);c.fill();c.fillRect(3,-16,2,16);c.beginPath();c.moveTo(5,-16);c.quadraticCurveTo(12,-12,9,-6);c.lineWidth=2;c.strokeStyle=COL.ink;c.stroke();c.restore()}
function heart(c,x,y,s,a){c.save();c.globalAlpha*=a;c.translate(x,y);c.scale(s,s);c.beginPath();c.moveTo(0,4);c.bezierCurveTo(-8,-3,-5,-10,0,-5);c.bezierCurveTo(5,-10,8,-3,0,4);c.fillStyle='#ff4d6d';c.fill();c.lineWidth=1.4/s;c.strokeStyle=COL.ink;c.stroke();c.restore()}
function star(c,x,y,r,fill,rot=0){c.beginPath();for(let i=0;i<10;i++){const a=rot-PI/2+i*PI/5,rr_=i%2?r*.45:r;c.lineTo(x+C(a)*rr_,y+S(a)*rr_)}c.closePath();c.fillStyle=fill;c.fill();c.lineWidth=2;c.strokeStyle=COL.ink;c.stroke()}
function ball(c,x,y,r,col='#ff4d6d',spin=0){circ(c,x,y,r,col);c.save();c.beginPath();c.arc(x,y,r,0,TAU);c.clip();c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=2.4;c.beginPath();c.moveTo(x+C(spin)*r*1.2,y+S(spin)*r*1.2);c.lineTo(x-C(spin)*r*1.2,y-S(spin)*r*1.2);c.stroke();c.restore()}
function drop(c,x,y,s=1,col='#5bc0f0'){c.beginPath();c.moveTo(x,y-5*s);c.quadraticCurveTo(x+4*s,y,x,y+3*s);c.quadraticCurveTo(x-4*s,y,x,y-5*s);c.fillStyle=col;c.fill();c.lineWidth=1.2;c.strokeStyle=COL.ink;c.stroke()}

/* ============ figure ============ */
function limb(c,a,b,d,upper,lower,w1,w2,endR,endCol){
  stroke(c,[a,b,d],Math.max(w1,w2)+4.5,COL.ink);stroke(c,[a,b],w1,upper);stroke(c,[b,d],w2,lower);
  if(endR)circ(c,d[0],d[1],endR,endCol,2.2);}
function shoe(c,k,f,col){let u=[f[0]-k[0],f[1]-k[1]];const n=Math.hypot(u[0],u[1])||1;u=[u[0]/n,u[1]/n];const p=[u[1],-u[0]];
  c.save();c.translate(f[0]+p[0]*4+u[0]*1.5,f[1]+p[1]*4+u[1]*1.5);c.rotate(Math.atan2(p[1],p[0]));c.beginPath();c.ellipse(0,0,9,5,0,0,TAU);c.fillStyle=col;c.fill();c.lineWidth=2;c.strokeStyle=COL.ink;c.stroke();c.restore()}
function face(c,P,t){
  const lk=P.look||[0,0];let e=P.eyes;const m=P.mouth;
  if(e==='open'&&(t%3.7)<.13)e='closed';
  c.lineCap='round';c.strokeStyle=COL.ink;c.fillStyle=COL.ink;c.lineWidth=2.1;
  for(const ex of [4.5,12]){const x=ex+lk[0],y=-2+lk[1];c.beginPath();
    if(e==='open'){c.ellipse(x,y,2.3,3,0,0,TAU);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+.8,y-1,.8,0,TAU);c.fill();c.fillStyle=COL.ink}
    else if(e==='wide'){c.arc(ex,-2,3.8,0,TAU);c.fillStyle='#fff';c.fill();c.stroke();c.fillStyle=COL.ink;c.beginPath();c.arc(x+.6,y,1.8,0,TAU);c.fill()}
    else if(e==='closed'){c.arc(ex,-3,3,.15*PI,.85*PI);c.stroke()}
    else if(e==='happy'){c.arc(ex,0,3,1.15*PI,1.85*PI);c.stroke()}
    else if(e==='squeeze'){c.moveTo(ex-3,-4);c.lineTo(ex+2,-2);c.lineTo(ex-3,0);c.stroke()}
    else if(e==='x'){c.moveTo(ex-2.5,-4.5);c.lineTo(ex+2.5,.5);c.moveTo(ex+2.5,-4.5);c.lineTo(ex-2.5,.5);c.stroke()}}
  c.beginPath();
  const mx=9,my=8;
  if(m==='smile'){c.arc(mx,my-4,5,.2*PI,.8*PI);c.stroke()}
  else if(m==='flat'){c.moveTo(mx-3.5,my);c.lineTo(mx+3.5,my);c.stroke()}
  else if(m==='sad'){c.arc(mx,my+4,4.5,1.2*PI,1.8*PI);c.stroke()}
  else if(m==='o'){c.ellipse(mx,my,2.4,2.8,0,0,TAU);c.fillStyle='#7a2230';c.fill();c.stroke()}
  else if(m==='open'||m==='big'||m==='yawn'){const w=m==='yawn'?4.5:5.5,h=m==='yawn'?6:m==='big'?5:4;
    if(m==='yawn')c.ellipse(mx,my+1,w,h,0,0,TAU);else{c.moveTo(mx-w,my-1);c.quadraticCurveTo(mx,my-2,mx+w,my-1);c.quadraticCurveTo(mx,my+h*1.6,mx-w,my-1)}
    c.fillStyle='#7a2230';c.fill();c.stroke();c.fillStyle='#ff8fa0';c.beginPath();c.ellipse(mx,my+(m==='yawn'?4:2.4),2.6,1.5,0,0,TAU);c.fill()}
  c.globalAlpha=.35;c.fillStyle=COL.cheek;c.beginPath();c.arc(1,6,3,0,TAU);c.fill();c.globalAlpha=1;
}
function drawFigure(c,J,P,t,H){
  c.save();
  if(P.flip!==1){c.translate(P.x,0);c.scale(P.flip,1);c.translate(-P.x,0)}
  limb(c,J.sh,J.elB,J.hB,COL.shirtD,COL.skinD,10,7,5,COL.skinD);
  limb(c,J.rootB,J.kB,J.ftB,COL.pantsD,COL.pantsD,11,10);shoe(c,J.kB,J.ftB,'#2c3c4c');
  H.mid&&H.mid(c,J,P,t);
  limb(c,J.rootF,J.kF,J.ftF,COL.pants,COL.pants,11,10);shoe(c,J.kF,J.ftF,COL.shoe);
  // torso
  const tb=[J.hip[0]+S(J.ta)*3,J.hip[1]-C(J.ta)*3],tt=[J.neck[0]-S(J.ta)*3,J.neck[1]+C(J.ta)*3];
  stroke(c,[J.hip,tb],18,COL.ink);stroke(c,[tb,tt],28,COL.ink);stroke(c,[J.hip,tb],14,COL.pants);stroke(c,[tb,tt],24,COL.shirt);
  // shirt stripe
  c.save();c.globalAlpha=.9;const sm=lp(tb,tt,.42);c.translate(sm[0],sm[1]);c.rotate(J.ta);c.fillStyle='#ffd23f';c.fillRect(-11,-3,22,5);c.restore();
  // neck + head
  stroke(c,[J.neck,lp(J.neck,J.hc,.5)],9,COL.ink);stroke(c,[J.neck,lp(J.neck,J.hc,.5)],6,COL.skin);
  c.save();c.translate(J.hc[0],J.hc[1]);c.rotate(J.ha);
  circ(c,0,0,HR,COL.skin,2.6);
  c.beginPath();c.arc(0,0,HR+1.2,2.75,5.8);c.quadraticCurveTo(6,-11,-2,-6);c.quadraticCurveTo(-8,-3,-14,7);c.closePath();c.fillStyle=COL.hair;c.fill();c.lineWidth=2.2;c.strokeStyle=COL.ink;c.stroke();
  circ(c,-5,3,3.6,COL.skin,2);
  face(c,P,t);c.restore();
  H.over&&H.over(c,J,P,t);
  limb(c,J.sh,J.elF,J.hF,COL.shirt,COL.skin,10,7,5.4,COL.skin);
  H.front&&H.front(c,J,P,t);
  c.restore();
}

/* ============ scenes ============ */
function sky(c,t,P){const g=c.createLinearGradient(0,0,0,G);g.addColorStop(0,TH_['sky-top']);g.addColorStop(1,TH_['sky-bottom']);c.fillStyle=g;c.fillRect(0,0,LW,LH);
  if(TH_.dark){c.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<26;i++){const x=(i*97)%LW,y=(i*53)%170;c.globalAlpha=.3+.4*Math.abs(S(t*1.3+i));c.fillRect(x,y,1.6,1.6)}c.globalAlpha=1;
    circ(c,340,46,16,'#f6f1d5',0);c.fillStyle=TH_['sky-top'];c.beginPath();c.arc(347,40,14,0,TAU);c.fill()}
  else{circ(c,345,44,18,'#ffd23f',2.4);}
  const sp=6+(P.scroll||0)*.18,vs=P.vscroll||0;
  [[40,60,1],[200,40,.8],[300,100,.65],[120,130,.55]].forEach(([x,y,s],i)=>{const xx=((x-t*sp*s)%(LW+120)+LW+120)%(LW+120)-60;const yy=vs?((y+t*vs*s)%(LH+60))-30:y;cloud(c,xx,yy,s)});}
function cloud(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=TH_.cloud;c.beginPath();c.arc(0,0,16,0,TAU);c.arc(18,-8,20,0,TAU);c.arc(38,0,15,0,TAU);c.rect(0,0,38,15);c.fill();c.restore()}
function ground(c,t,P){c.fillStyle=TH_.grass;c.fillRect(0,G,LW,LH-G);c.fillStyle=TH_['grass-dark'];c.fillRect(0,G,LW,4);
  const sp=P.scroll||0;for(let i=0;i<9;i++){const x=((i*53-t*sp)%(LW+60)+LW+60)%(LW+60)-30;c.strokeStyle=TH_['grass-dark'];c.lineWidth=2;c.lineCap='round';
    c.beginPath();c.moveTo(x,G+14+(i%3)*7);c.lineTo(x-3,G+8+(i%3)*7);c.moveTo(x+4,G+14+(i%3)*7);c.lineTo(x+6,G+7+(i%3)*7);c.stroke()}}
function indoor(c,t,P){c.fillStyle=TH_.wall;c.fillRect(0,0,LW,G);c.strokeStyle=TH_['wall-line'];c.lineWidth=2;
  for(let x=-20;x<LW;x+=36){c.beginPath();c.moveTo(x,0);c.lineTo(x,G);c.stroke()}
  // window
  box(c,28,52,74,62,TH_['sky-top'],6,3);c.strokeStyle=COL.ink;c.lineWidth=3;c.beginPath();c.moveTo(65,52);c.lineTo(65,114);c.moveTo(28,83);c.lineTo(102,83);c.stroke();
  c.fillStyle=TH_.floor;c.fillRect(0,G,LW,LH-G);c.fillStyle=TH_['floor-dark'];c.fillRect(0,G,LW,4);
  c.strokeStyle=TH_['floor-dark'];c.lineWidth=2;for(let x=10;x<LW;x+=48){c.beginPath();c.moveTo(x,G+4);c.lineTo(x-14,LH);c.stroke()}}
function water(c,t){const g=c.createLinearGradient(0,G-60,0,LH);g.addColorStop(0,TH_.water);g.addColorStop(1,'#145a85');c.fillStyle=g;c.fillRect(0,G-56,LW,LH);}
function waves(c,t,y,alpha){c.save();c.globalAlpha=alpha;c.beginPath();c.moveTo(0,LH);for(let x=0;x<=LW;x+=8)c.lineTo(x,y+3*S(x*.06+t*4));c.lineTo(LW,LH);c.closePath();c.fillStyle=TH_.water;c.fill();
  c.globalAlpha=1;c.beginPath();for(let x=0;x<=LW;x+=8)c.lineTo(x,y+3*S(x*.06+t*4));c.strokeStyle='#ffffff';c.lineWidth=2.4;c.stroke();c.restore()}
function shadow(c,J,P){if(P.noShadow)return;const low=Math.max(J.ftF[1],J.ftB[1]);const h=clamp((G-low)/120,0,1);
  c.save();c.globalAlpha=.22*(1-h*.6);c.fillStyle='#000';c.beginPath();c.ellipse((J.ftF[0]+J.ftB[0])/2,G+3,26*(1-h*.5),5*(1-h*.4),0,0,TAU);c.fill();c.restore()}

function chair(c,x){c.lineCap='round';stroke(c,[[x-22,G-27],[x-22,G-96]],9,COL.ink);stroke(c,[[x-22,G-27],[x-22,G-96]],5,'#8c5a33');
  stroke(c,[[x-18,G-24],[x-18,G]],7,COL.ink);stroke(c,[[x+24,G-24],[x+24,G]],7,COL.ink);box(c,x-26,G-30,56,8,'#b8763f',3)}
function desk(c,x,w=96){stroke(c,[[x+w-8,G-52],[x+w-8,G]],8,COL.ink);stroke(c,[[x+6,G-52],[x+6,G]],8,COL.ink);
  c.beginPath();c.moveTo(x,G-62);c.lineTo(x+w,G-62);c.lineTo(x+w-6,G-54);c.lineTo(x-6,G-54);c.closePath();c.fillStyle='#c98c4f';c.fill();c.lineWidth=2.4;c.strokeStyle=COL.ink;c.stroke();box(c,x-6,G-54,w,6,'#a86d38',1)}
function board(c,x,y,w,h){stroke(c,[[x+18,y+h],[x+8,G]],6,COL.ink);stroke(c,[[x+w-18,y+h],[x+w-8,G]],6,COL.ink);box(c,x-6,y-6,w+12,h+12,'#9b6337',6,2.6);box(c,x,y,w,h,'#ffffff',3,2)}
function door(c,x,open,col='#c4703a'){const top=G-128,w=50;box(c,x-8,top-10,w+16,138,'#d27752',4,2.6);
  box(c,x,top,w,128,'#ffe3a0',2,2);c.fillStyle='rgba(255,210,90,.55)';c.fillRect(x+4,top+4,w-8,120);
  const pw=Math.max(5,w*C(open*1.35));const left=x+w-pw;box(c,left,top,pw,128,col,2,2.4);
  if(pw>14){box(c,left+pw*.15,top+14,pw*.7,40,'rgba(0,0,0,.12)',3,1.4);box(c,left+pw*.15,top+66,pw*.7,46,'rgba(0,0,0,.12)',3,1.4)}
  circ(c,left+6,G-66,3.4,'#ffd23f',1.6);return left+6}
function bush(c,x,w,h){c.fillStyle='#4f9d47';c.strokeStyle=COL.ink;c.lineWidth=2.4;c.beginPath();const n=6;for(let i=0;i<=n;i++){const cx=x+i*w/n,cy=G-h+ (i%2?10:0)+10;c.moveTo(cx+18,cy);c.arc(cx,cy,18,0,TAU)}c.fill();c.stroke();c.fillRect(x-14,G-h+12,w+28,h-12);c.beginPath();c.moveTo(x-18,G);c.lineTo(x-18,G-h+20);c.moveTo(x+w+18,G);c.lineTo(x+w+18,G-h+20);c.stroke()}

/* ============ strokes for write / draw / paint ============ */
function strokesPath(S_,ox,oy,s){return S_.map(st=>({col:st.col,w:st.w,pts:st.pts.map(p=>[ox+p[0]*s,oy+p[1]*s])}))}
function arcPts(cx,cy,rx,ry,a0,a1,n){const o=[];for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);o.push([cx+C(a)*rx,cy+S(a)*ry])}return o}
function totalLen(ss){let L=0;ss.forEach(s=>{for(let i=1;i<s.pts.length;i++)L+=Math.hypot(s.pts[i][0]-s.pts[i-1][0],s.pts[i][1]-s.pts[i-1][1])});return L}
function drawProgress(c,ss,L,p,defW,defCol){let rem=L*p,cur=null;for(const s of ss){c.lineCap='round';c.lineJoin='round';c.lineWidth=s.w||defW;c.strokeStyle=s.col||defCol;c.beginPath();c.moveTo(s.pts[0][0],s.pts[0][1]);cur=s.pts[0];
  for(let i=1;i<s.pts.length;i++){const a=s.pts[i-1],b=s.pts[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(rem<=0)break;if(rem<d){const k=rem/d;cur=[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];c.lineTo(cur[0],cur[1]);rem=0;break}c.lineTo(b[0],b[1]);cur=b;rem-=d}
  c.stroke();if(rem<=0)break}return cur}

const ALIAS={'wake up':'wake','pick up':'pick','stand up':'stand','sit down':'sit','look at':'look','listen to':'listen','brush teeth':'brush','brush your teeth':'brush','wash hands':'wash','wash your hands':'wash','ride a bike':'ride','water the plants':'water','play ball':'play','go up':'climb','fall down':'fall','turn':'spin','turn around':'spin','yell':'shout','scream':'shout','speak':'talk','see':'look','hear':'listen','study':'read','sleepy':'yawn','grab':'catch','toss':'throw','skip':'hop'};
const CATS=['Move','Home','School','Play','Feelings'];

/* ============ search ============ */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^to\s+/,'').replace(/[^a-z\s]/g,'').trim().replace(/\s+/g,' ');
const INDEX=[];V.forEach(v=>{const keys=new Set([v.w,v.w2,v.phrase,v.third,v.ing,v.past,...v.pt.split(/,\s*/)].filter(Boolean).map(norm));
  v.pt.split(/,\s*/).forEach(p=>keys.add(norm(p.replace(/\s*\(.*\)/,''))));keys.forEach(k=>INDEX.push([k,v]))});
Object.entries(ALIAS).forEach(([k,w])=>{const v=V.find(x=>x.w===w);if(v)INDEX.push([norm(k),v])});
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function find(q){q=norm(q);if(!q)return {exact:null,list:[]};const ex=INDEX.find(([k])=>k===q);const seen=new Set(),list=[];
  INDEX.filter(([k])=>k.startsWith(q)).concat(INDEX.filter(([k])=>!k.startsWith(q)&&k.includes(q))).forEach(([k,v])=>{if(!seen.has(v.w)){seen.add(v.w);list.push([k,v])}});
  if(!list.length)INDEX.map(([k,v])=>[lev(q,k),k,v]).sort((a,b)=>a[0]-b[0]).forEach(([d,k,v])=>{if(d<=Math.max(2,q.length/3)&&!seen.has(v.w)){seen.add(v.w);list.push([k,v])}});
  return {exact:ex?ex[1]:null,list:list.slice(0,6)}}

/* ============ UI ============ */
const $=id=>document.getElementById(id);const q=$('q'),sugg=$('sugg'),card=$('card');
let cur=V[0],t0=performance.now(),tt=0,speed=1,paused=false,last=performance.now(),missed='';
const label=v=>v.w2||v.w;
const esc=s=>s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const canSpeak='speechSynthesis' in window;
const spk='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
function highlight(ex,v){const forms=[v.w,v.w2,v.third,v.ing,v.past].filter(Boolean).sort((a,b)=>b.length-a.length);let out=esc(ex);for(const f of forms){const re=new RegExp('\\b('+f.replace(/ /g,'\\s')+')\\b','i');if(re.test(out)){out=out.replace(re,'<mark>$1</mark>');break}}return out}
function renderCard(){const v=cur;card.innerHTML=`
  ${missed?`<div class="miss">Verbie doesn\u2019t know <b>\u201c${esc(missed)}\u201d</b> yet. Showing <button type="button" data-go="${v.w}">${esc(label(v))}</button> instead.</div>`:''}
  <div class="top"><div><h2 class="word">${esc(label(v))}</h2>${v.phrase&&v.phrase!==label(v)?`<div class="phrase">${esc(v.phrase)}</div>`:''}</div>
  ${canSpeak?`<button class="say" type="button" id="sayw" aria-label="Hear the word">${spk}</button>`:''}</div>
  <span class="pt">${esc(v.pt)}</span>
  <div class="forms">
    <div class="form"><small>I / you / we</small><b>${esc(label(v))}</b></div>
    <div class="form"><small>he / she / it</small><b>${esc(v.third)}</b></div>
    <div class="form"><small>right now</small><b>${esc(v.ing)}</b></div>
    <div class="form"><small>yesterday</small><b>${esc(v.past)}</b></div>
  </div>
  <div class="example"><p>${highlight(v.ex,v)}</p>${canSpeak?`<button class="say" type="button" id="says" aria-label="Hear the sentence">${spk}</button>`:''}</div>`;
  if(canSpeak){$('sayw').onclick=()=>say(label(v));$('says').onclick=()=>say(v.ex)}
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-current',c.dataset.w===v.w?'true':'false'));}
function say(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=.85;const vs=speechSynthesis.getVoices().filter(x=>/^en(-|_)US/i.test(x.lang));if(vs.length)u.voice=vs[0];speechSynthesis.speak(u)}catch(e){}}
function go(v,miss=''){cur=v;missed=miss;tt=0;renderCard();try{history.replaceState(null,'','#'+v.w)}catch(e){}}
function showSugg(list){if(!list.length){sugg.hidden=true;return}sugg.innerHTML=list.map(([k,v],i)=>`<li role="option" data-w="${v.w}" class="${i===0?'on':''}"><b>${esc(label(v))}</b><small>${esc(v.pt)}</small></li>`).join('');sugg.hidden=false}
q.addEventListener('input',()=>{const r=find(q.value);showSugg(r.list);if(r.exact&&r.exact!==cur)go(r.exact)});
q.addEventListener('keydown',e=>{const items=[...sugg.querySelectorAll('li')];let i=items.findIndex(li=>li.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;items[i]?.classList.remove('on');i=(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[i].classList.add('on')}
  else if(e.key==='Enter'){e.preventDefault();const r=find(q.value);const pick=items[i]?V.find(v=>v.w===items[i].dataset.w):r.exact||(r.list[0]&&r.list[0][1]);
    if(pick){go(pick);q.value=label(pick)}else if(q.value.trim()){go(V[Math.floor(Math.random()*V.length)],q.value.trim())}sugg.hidden=true}
  else if(e.key==='Escape')sugg.hidden=true});
sugg.addEventListener('mousedown',e=>{const li=e.target.closest('li');if(!li)return;e.preventDefault();const v=V.find(x=>x.w===li.dataset.w);go(v);q.value=label(v);sugg.hidden=true});
q.addEventListener('blur',()=>setTimeout(()=>sugg.hidden=true,120));
card.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){missed='';renderCard()}});
$('rand').onclick=()=>{let v;do v=V[Math.floor(Math.random()*V.length)];while(v===cur);go(v);q.value=''};
$('slow').onclick=e=>{speed=speed===1?.45:1;e.currentTarget.setAttribute('aria-pressed',speed!==1)};
$('pause').onclick=e=>{paused=!paused;e.currentTarget.setAttribute('aria-pressed',paused);e.currentTarget.textContent=paused?'Play':'Pause'};
$('count').textContent=`${V.length} actions`;
$('groups').innerHTML=CATS.map(cat=>`<div class="group"><h3>${cat}</h3><div class="chips">${V.filter(v=>v.cat===cat).map(v=>`<button type="button" class="chip" data-w="${v.w}">${esc(label(v))}</button>`).join('')}</div></div>`).join('');
$('groups').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const v=V.find(x=>x.w===b.dataset.w);go(v);q.value='';window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});

/* ============ loop ============ */
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)tt+=dt*speed;
  const w=cv.width,h=cv.height;ctx.setTransform(w/LW,0,0,h/LH,0,0);ctx.clearRect(0,0,LW,LH);
  let P;try{P=cur.a(tt)}catch(e){console.error(e);P=pose({})}
  const scene=P.scene;
  if(scene==='in')indoor(ctx,tt,P);else{sky(ctx,tt,P);if(scene==='water')water(ctx,tt);else if(scene!=='climb')ground(ctx,tt,P);}
  ctx.save();ctx.globalAlpha=P.alpha;
  const J=solve(P);
  P.back&&P.back(ctx,J,P,tt);if(scene!=='climb'&&scene!=='water')shadow(ctx,J,P);
  drawFigure(ctx,J,P,tt,{mid:P.mid,over:P.over,front:P.front});
  ctx.restore();
  requestAnimationFrame(frame)}
const start=()=>{const h=decodeURIComponent((location.hash||'').slice(1));const v=V.find(x=>x.w===h);if(v)cur=v;renderCard();fit();requestAnimationFrame(frame)};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{}).catch(()=>{});
start();
</script>

</body></html>
